name: 🔐 Pipeline DevSecOps

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pipeline:
    name: Build, Segurança e Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ✅ PASSO 1: Já está pronto — Baixar o código
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # ✅ PASSO 2: Já está pronto — Build
      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"

      # ❌ PASSO 3: IMPLEMENTE AQUI — Secrets Scanning com Gitleaks
      - name: Secrets Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --redact --exit-code 1
          

      # ❌ PASSO 4: IMPLEMENTE AQUI — SAST com Semgrep
      - name: Static Analysis (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/owasp-top-ten"
          # pipeline quebra se encontrar vulnerabilidades
          audit_on: error
        

      # ❌ PASSO 5: IMPLEMENTE AQUI — SCA com Grype
      - name: Dependency Vulnerability Scan (Grype)
        uses: anchore/scan-action@v3
        with:
          path: "."
          fail-on-severity: medium

      # ✅ PASSO 6: Já está pronto — Deploy (só roda se tudo passar)
      - name: 🌐 Configurar GitHub Pages
        if: success()   
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  


      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4
